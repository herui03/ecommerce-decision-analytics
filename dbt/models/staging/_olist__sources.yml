version: 2

sources:
  - name: olist_raw
    description: >
      Raw Olist CSVs read in place by DuckDB. Nothing is loaded or copied - the CSV on
      disk IS the source table, so the pipeline always reflects the file that shipped
      with the repo and can never silently drift from it.
    # OLIST_RAW_DIR switches the pipeline between the real Kaggle CSVs (default,
    # ../data/raw, never committed) and the deterministic synthetic sample
    # (../data/sample/raw, generated by `python -m portfolio.pipeline sample`).
    meta:
      external_location: "read_csv_auto('{{ env_var('OLIST_RAW_DIR', '../data/raw') }}/{name}.csv')"

    tables:
      # --- transactional core -------------------------------------------------
      - name: olist_orders_dataset
        description: "One row per order. 99,441 rows verified 2026-07-16."
        columns:
          - name: order_id
            description: "Primary key. Verified unique."
            data_tests: [unique, not_null]
          - name: customer_id
            description: >
              Per-ORDER customer key - NOT a person. Olist mints a fresh customer_id for
              every order, so this is also unique (99,441). The person-level key is
              customers.customer_unique_id. Grouping on this column reports a fake 100%
              one-time rate. See docs/challenge-01-rfm-frequency-collapse.md.
            data_tests: [unique, not_null]

      - name: olist_order_items_dataset
        description: >
          One row per ITEM within an order - NOT one row per order. 112,650 rows across
          98,666 distinct orders; order_id repeats 13,984 times. Joining this to orders
          without aggregating first fans out order-level measures.
        columns:
          - name: order_id
            description: "FK to orders. NOT unique here - 13,984 duplicates."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('olist_raw', 'olist_orders_dataset')
                    field: order_id

      - name: olist_order_payments_dataset
        description: >
          One row per payment instrument used on an order. 103,886 rows across 99,440
          distinct orders - one order short of the 99,441 in orders, and order_id repeats
          4,446 times (split payments / instalments).
        columns:
          - name: order_id
            description: "FK to orders. NOT unique here - 4,446 duplicates."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('olist_raw', 'olist_orders_dataset')
                    field: order_id

      - name: olist_order_reviews_dataset
        description: >
          One row per review. 99,224 rows. review_id is NOT a reliable key - it has 814
          duplicates, and order_id has 551. Only (review_id, order_id) is unique. Treat
          review_id as an attribute, not an identifier.
        columns:
          - name: review_id
            description: "NOT unique - 814 duplicates. Do not use as a key."
            data_tests: [not_null]
          - name: order_id
            description: "NOT unique - 551 duplicates (an order can carry >1 review row)."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('olist_raw', 'olist_orders_dataset')
                    field: order_id

      # --- entities -----------------------------------------------------------
      - name: olist_customers_dataset
        description: "One row per customer_id (per-order). 99,441 rows → 96,096 real people."
        columns:
          - name: customer_id
            data_tests: [unique, not_null]
          - name: customer_unique_id
            description: >
              Person-level key. NOT unique here (3,345 duplicate rows) - that duplication
              IS the repeat-purchase population. Independently cross-checked against the
              frequency distribution: sum of (orders-1) over repeat customers = 3,345.
            data_tests: [not_null]

      - name: olist_products_dataset
        description: "One row per product. 32,951 rows."
        columns:
          - name: product_id
            data_tests: [unique, not_null]

      - name: olist_sellers_dataset
        description: "One row per seller. 3,095 rows."
        columns:
          - name: seller_id
            data_tests: [unique, not_null]

      - name: olist_geolocation_dataset
        description: >
          1,000,163 rows but only 19,015 distinct zip prefixes - roughly 53 rows per zip.
          Has NO unique key. Must be aggregated to a centroid before use; joining it raw
          to customers or sellers multiplies rows ~53x.
        columns:
          - name: geolocation_zip_code_prefix
            description: "NOT unique - 981,148 duplicate rows."
            data_tests: [not_null]

      - name: product_category_name_translation
        description: "PT→EN category lookup. 71 rows."
        columns:
          - name: product_category_name
            data_tests: [unique, not_null]

      # --- B2B seller-acquisition funnel --------------------------------------
      - name: olist_marketing_qualified_leads_dataset
        description: >
          8,000 marketing-qualified leads. This funnel recruits SELLERS onto the
          marketplace - it is not consumer marketing. There are no offers, costs, or
          treatment flags anywhere in the Olist source (verified across all 11 tables).
        columns:
          - name: mql_id
            data_tests: [unique, not_null]

      - name: olist_closed_deals_dataset
        description: >
          842 leads that converted to signed sellers. Both mql_id and seller_id are
          unique - a clean 1:1. Lead→won conversion = 842/8,000 = 10.53%.
          Note: only 380 of 842 (45.13%) join to a seller that ever transacted.
        columns:
          - name: mql_id
            data_tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: source('olist_raw', 'olist_marketing_qualified_leads_dataset')
                    field: mql_id
          - name: seller_id
            description: "Unique (842). Only 380 match olist_sellers_dataset - unexplained."
            data_tests: [unique, not_null]
